name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          # macOS exposes its default temporary directory below /var, which is
          # a system symlink. Use the canonical runner directory so security
          # tests can continue rejecting symlinked vault path components.
          TMPDIR: ${{ runner.temp }}
        run: go test ./...
      - run: go vet ./...

  race-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: make fmt-check
      - name: Race detector
        run: make race
      - name: Compile Linux, macOS, and Windows binaries
        run: make cross-build
